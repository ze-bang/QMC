# Spin-1/2 antiferromagnetic Heisenberg model on the 2D square lattice.
# Standard literature benchmark: at beta = L (with L = 8), the
# ground-state staggered magnetization should be in the range
# m_s^2 ~ 0.094 (Sandvik & Evertz 2010).

[lattice]
lattice         = square
Lx              = 8
Ly              = 8

[model]
J               = 1.0

[simulation]
beta            = 8.0
thermalization  = 8000
measurements    = 80000
measure_every   = 1
replicas        = 4
seed            = 0xc0ffee

[output]
output_csv      = square_L8_b8.csv
