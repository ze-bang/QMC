# Spin-1/2 antiferromagnetic Heisenberg chain
# A canonical SSE warm-up: 1D L=32 chain at beta = 4.

[lattice]
lattice         = chain
Lx              = 32
Ly              = 32        # ignored for chain

[model]
J               = 1.0       # antiferromagnetic exchange (J > 0)

[simulation]
beta            = 4.0
thermalization  = 5000
measurements    = 50000
measure_every   = 1
replicas        = 4
seed            = 0xdeadbeef
verbose         = true

[output]
output_csv      = chain_L32_b4.csv
