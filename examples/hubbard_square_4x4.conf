# Half-filled Hubbard on the 4x4 square lattice -- the canonical DQMC
# benchmark for the repulsive Hubbard model with a finite gap.
[lattice]
lattice         = square
Lx              = 4
Ly              = 4

[model]
t               = 1.0
U               = 4.0
mu              = 0.0          # half filling on bipartite

[simulation]
beta            = 4.0
L_tau           = 40           # dt = 0.1
n_stab          = 10
thermalization  = 200
measurements    = 1000
measure_every   = 1
replicas        = 2
seed            = 0xdeadbeefcafebabe
